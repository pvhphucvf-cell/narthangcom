<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>84 Đại Thành Tựu Giả - Mahasiddhas Full List</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:wght@300;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/narthang-style.css">

    <style>
        :root {
            --narthang-gold: #c5a059;
            --narthang-dark: #0a2417;
            --narthang-white: #fdf5e6;
            --glow-gold: rgba(197, 160, 89, 0.3);
        }

        body { 
            background: radial-gradient(circle, #0e1f16 0%, #05120c 100%);
            background-attachment: fixed;
            color: var(--narthang-white);
            font-family: 'EB Garamond', serif;
            overflow-x: hidden;
        }

        body::after { 
            content:""; position:fixed; top:0; left:0; width:100%; height:100%; 
            background-image:radial-gradient(rgba(197,160,89,0.05) 1px,transparent 1px); 
            background-size:50px 50px; z-index:-1; animation:rain 20s linear infinite; pointer-events:none; 
        }
        @keyframes rain { from{background-position:0 0} to{background-position:0 1000px} }
        @keyframes cardAppear { from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:translateY(0)} }

        .nav-sticky { 
            position:sticky; top:70px; 
            background: rgba(5, 18, 12, 0.95);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding: 1rem; display:flex; justify-content:center; gap:15px; z-index:1000; 
            backdrop-filter: blur(10px);
        }

        .flag-btn { 
            background:rgba(255,255,255,0.05); border:1px solid rgba(197, 160, 89, 0.4); 
            cursor:pointer; transition:0.3s; border-radius:2px; padding:6px 15px; 
            display:flex; align-items:center; font-weight:bold; color:white; font-size:0.8rem; 
            font-family: 'Montserrat', sans-serif;
        }

        .flag-btn.active-btn { 
            background:var(--narthang-gold); color:#000; 
            box-shadow:0 0 15px var(--narthang-gold); 
        }

        .flag-btn img { width:20px; margin-right:8px; }

        .container { max-width:1400px; margin:40px auto; padding:0 40px; min-height: 800px; }
        
        h1 { 
            text-align:center; color:var(--narthang-gold); 
            font-family: 'Playfair Display', serif; 
            font-size: 4rem; margin-bottom: 2rem; 
            text-transform: uppercase; letter-spacing: 12px;
            text-shadow:0 0 20px rgba(197,160,89,0.4); 
        }

        .mahasiddha-grid { 
            display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); 
            gap:30px; margin-top:30px; 
        }

        .card { 
            background: rgba(5, 18, 12, 0.8);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 35px; position:relative; overflow:hidden; 
            transition:0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            cursor:pointer; display:flex; flex-direction:column; color: inherit; 
        }

        .card:hover { 
            transform:translateY(-10px); 
            box-shadow:0 15px 40px rgba(0,0,0,0.6), 0 0 20px var(--glow-gold); 
            border-color:var(--narthang-gold); 
            background: rgba(197, 160, 89, 0.05);
        }

        .card-num { 
            color:var(--narthang-gold); font-weight:800; font-size:0.75rem; 
            text-transform:uppercase; margin-bottom:15px; letter-spacing: 2px;
            border-bottom:1px solid rgba(197, 160, 89, 0.1); padding-bottom:8px; 
        }

        .card-name { 
            font-family: 'Playfair Display', serif; color: #fff; 
            margin-bottom:15px; font-size:1.8rem; letter-spacing: 1px;
        }

        .card-bio { font-size:1.05rem; color:#ccc; font-style:italic; line-height:1.7; }
        
        .lang-page { display:none; }
        .lang-page.active-page { display:block; }

        footer { 
            background:rgba(0,0,0,0.95); border-top:1px solid rgba(197, 160, 89, 0.2); 
            padding:5rem 2rem; margin-top:5rem; text-align:center; 
        }

        .tibetan-footer { 
            font-size: 2.2rem; color: #fff; margin-bottom: 20px; 
            display: block; text-shadow: 0 0 20px var(--narthang-gold);
        }
    </style>
</head>

            {id:6,name:["Saraha","Saraha","薩拉哈","ས་ར་ཧ།"],bio:["Mũi tên chân lý, cha đẻ các bản đạo ca.","The Arrow-Maker.","製箭者。","ས་ར་ཧ།"]},
            {id:7,name:["Kankaripa","Kankaripa","康卡里巴","ཀངྐ་རི་པ།"],bio:["Người góa phụ tu hành bên thi hài vợ.","The Widower.","悼念亡妻者。","ཀངྐ་རི་པ།"]},

            {id:19,name:["Tilopa","Tilopa","帝洛巴","ཏི་ལོ་པ།"],bio:["Người giã vừng, sơ tổ dòng Kagyu.","The Sesame Crusher.","壓榨芝麻者.","ཏི་ལོ་པ།"]},

        function fillGrid(lang){
            const langIdx = ['vi','en','zh','bo'].indexOf(lang);
            const grid = document.getElementById(`grid-${lang}`);
            if(!grid) return; grid.innerHTML = ''; 
            data.forEach((item,index)=>{
                const card=document.createElement('div'); card.className='card'; card.style.animation=`cardAppear 0.8s ease-out backwards ${index*0.04}s`; 
                let o; if(lang==='vi') o=`Bậc Thánh ${ordinalsVi[item.id-1]||item.id}`; else if(lang==='bo') o=`གྲུབ་ཐོབ་ #${item.id}`; else o=`Siddha #${item.id}`;
                card.innerHTML=`<div class="card-num">${o}</div><h3 class="card-name">${item.name[langIdx]||item.name[0]}</h3><div class="card-bio">${item.bio[langIdx]||item.bio[0]}</div>`;
                grid.appendChild(card);
            });
        }
        function setLang(id){ localStorage.setItem('selectedLanguage',id); document.querySelectorAll('.lang-page').forEach(p=>p.classList.remove('active-page')); const t=document.getElementById(id); if(t){t.classList.add('active-page'); fillGrid(id)} document.querySelectorAll('.flag-btn').forEach(b=>b.classList.remove('active-btn')); const a=document.getElementById('btn-'+id); if(a) a.classList.add('active-btn'); }
        window.onload=()=>{setLang(localStorage.getItem('selectedLanguage')||'vi')};
